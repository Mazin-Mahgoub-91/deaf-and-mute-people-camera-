<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SLS حروف عربية كاملة 28</title>
<style>
body{margin:0;background:#000;color:#0f0;text-align:center;padding:10px;font-family:tahoma}
#box{position:relative;display:inline-block;margin-top:10px}
video, canvas{width:640px;height:480px;border:3px solid #0f0;border-radius:10px}
canvas{position:absolute;top:0;left:0}
button{padding:12px 25px;font-size:16px;background:#0f0;color:#000;border:none;margin:5px;cursor:pointer;border-radius:8px;font-weight:bold}
#result{font-size:80px;color:yellow;margin:15px;font-weight:bold;min-height:100px}
#log{background:#111;border:2px solid #0f0;padding:8px;margin-top:8px;text-align:right;color:#0ff;font-size:11px;height:120px;overflow-y:auto}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h2>🔥 الكاميرا بتعرف 28 حرف عربي</h2>
<button onclick="startCam()">1. شغل الكاميرا</button>
<button onclick="startDetect()">2. ابدأ التعرف</button>

<div id="result">الحرف:...</div>
<div class="small">لو حرف ملخبط صورو لي وقول لي الحركة الصح شنو</div>

<div id="box">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c" width="640" height="480"></canvas>
</div>

<div id="log">اضغط 1 ثم 2<br></div>

<script type="module">
import {HandLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3";

const log = t => {document.getElementById('log').innerHTML += t + '<br>'};
const video = document.getElementById('v');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const resultDiv = document.getElementById('result');
let handLandmarker, drawingUtils, lastLetter = '', stableCount = 0;

// دالة تحسب المسافة بين نقطتين
function dist(a,b){ return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2) }

// ====== قاموس 28 حرف عربي ArSL ======
function classifyArabicLetter(lm){
  // حالة الأصابع 1=مرفوع 0=مطوي
  const T = lm[4].x > lm[2].x; // إبهام
  const I = lm[8].y < lm[6].y; // سبابة
  const M = lm[12].y < lm[10].y; // وسط
  const R = lm[16].y < lm[14].y; // بنصر
  const P = lm[20].y < lm[18].y; // خنصر

  // مسافات مهمة
  const thumbToIndex = dist(lm[4], lm[8]);
  const indexToMiddle = dist(lm[8], lm[12]);

  // القاموس: نمط الأصابع T,I,M,R,P
  // ملاحظة: الحروف المتشابهة بنفرقها بالمسافة أو اتجاه الإبهام
  const dict = {
    '00000': 'أ', // قبضة
    '01000': 'ب', // سبابة
    '01100': 'ت', // سبابة+وسط
    '01110': 'ث', // 3 أصابع
    '10000': 'ج', // إبهام بس
    '00100': 'د', // وسط بس
    '11000': 'ه', // إبهام+سبابة مقفولين
    '01010': 'ح', // سبابة+بنصر V
    '01111': 'خ', // 4 أصابع + إبهام مطوي
    '10001': 'ذ', // إبهام+خنصر
    '10100': 'ر', // إبهام+وسط
    '11100': 'ز', // إبهام+سبابة+وسط
    '00001': 'س', // خنصر بس
    '00010': 'ش', // بنصر بس
    '01001': 'ص', // سبابة+خنصر
    '11001': 'ض', // إبهام+سبابة+خنصر
    '11101': 'ط', // كلهم إلا البنصر
    '10101': 'ظ', // إبهام+وسط+خنصر
    '11111': 'ع', // كف مفتوح
    '00101': 'غ', // وسط+خنصر
    '01011': 'ف', // 3 أصابع + إبهام مفتوح
    '11010': 'ق', // إبهام+سبابة+بنصر
    '00111': 'ك', // 3 أصابع تحت
    '11110': 'ل', // 4 أصابع + إبهام
    '10010': 'م', // إبهام+بنصر
    '10110': 'ن', // إبهام+وسط+بنصر
    '10011': 'ه', // إبهام+بنصر+خنصر
    '10111': 'و', // كلهم مفتوحين
    '11011': 'ي' // كلهم إلا الوسط
  };

  let pattern = [T?1:0, I?1:0, M?1:0, R?1:0, P?1:0].join('');

  // تعديل خاص للحروف المتشابهة بالمسافة
  if(pattern === '11000' && thumbToIndex > 0.08) return 'ه'; // هاء إبهام بعيد
  if(pattern === '11000' && thumbToIndex < 0.05) return 'لا'; // لام ألف

  return dict[pattern] || '?';
}

window.startCam = async function(){
  log('1. فتح الكاميرا...');
  const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
  video.srcObject = stream;
  await video.play();
  log('2. الكاميرا شغالة ✅');
}

window.startDetect = async function(){
  log('3. تحميل موديل اليد...');
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.6,
    minHandPresenceConfidence: 0.6
  });
  log('4. جاهز ✅ اعمل أي حرف');

  drawingUtils = new DrawingUtils(ctx);

  function detectFrame(){
    let startTimeMs = performance.now();
    const result = handLandmarker.detectForVideo(video, startTimeMs);
    ctx.clearRect(0,0,640,480);

    if(result.landmarks && result.landmarks.length > 0){
      const lm = result.landmarks[0];
      drawingUtils.drawLandmarks(lm, {color: '#0f0', lineWidth: 2});
      drawingUtils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, {color: '#ff0', lineWidth: 2});

      let letter = classifyArabicLetter(lm);

      // فلتر: الحرف لازم يثبت 5 فريمات عشان ما يرعش
      if(letter === lastLetter) stableCount++;
      else { lastLetter = letter; stableCount = 0; }

      if(stableCount > 5 && letter!== '?') {
        resultDiv.innerHTML = 'الحرف: ' + letter;
      }
    } else {
      resultDiv.innerHTML = 'الحرف:...';
      lastLetter = '';
      stableCount = 0;
    }

    requestAnimationFrame(detectFrame);
  }
  detectFrame();
}
</script>
</body>
</html>
